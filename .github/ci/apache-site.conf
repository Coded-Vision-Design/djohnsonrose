# Used by .github/workflows/ci-site.yml to serve the site for the browser tests.
Listen 127.0.0.1:8799

<VirtualHost 127.0.0.1:8799>
    DocumentRoot /var/www/site
    DirectoryIndex index.php index.html

    <Directory /var/www/site>
        AllowOverride All
        Require all granted
    </Directory>
</VirtualHost>
