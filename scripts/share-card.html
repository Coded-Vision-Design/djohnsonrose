<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<!-- The 1200x630 share card behind og:image and twitter:image. Rendered to
     assets/img/share-card.png by scripts/make-share-image.mjs. It carries the
     name, photo and address but no job title, as the headline is not settled. -->
<title>Share card</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; width: 1200px; height: 630px; overflow: hidden; }
  body {
    font-family: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
    color: #ffffff;
    background:
      radial-gradient(ellipse 60% 80% at 85% 20%, rgba(76, 194, 255, 0.55), transparent 70%),
      radial-gradient(ellipse 70% 90% at 10% 110%, rgba(0, 120, 212, 0.9), transparent 70%),
      linear-gradient(135deg, #061a3a 0%, #003e7e 55%, #0067c0 100%);
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .card {
    width: 1040px;
    height: 470px;
    display: flex;
    align-items: center;
    gap: 64px;
    padding: 0 72px;
    border-radius: 28px;
    background: rgba(255, 255, 255, 0.1);
    border: 1px solid rgba(255, 255, 255, 0.28);
    box-shadow: 0 30px 80px rgba(0, 0, 0, 0.35);
  }
  .photo {
    flex: none;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    object-fit: cover;
    border: 8px solid rgba(255, 255, 255, 0.9);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.35);
  }
  .text { min-width: 0; }
  .label {
    display: flex;
    align-items: center;
    gap: 14px;
    margin: 0 0 22px;
    font-size: 26px;
    font-weight: 600;
    letter-spacing: 0.02em;
    color: rgba(255, 255, 255, 0.92);
  }
  .logo { display: grid; grid-template-columns: repeat(2, 14px); gap: 3px; }
  .logo span { width: 14px; height: 14px; background: #ffffff; border-radius: 2px; }
  h1 { margin: 0; font-size: 76px; line-height: 1.05; font-weight: 700; letter-spacing: -0.01em; }
  .tagline { margin: 22px 0 34px; font-size: 32px; line-height: 1.3; color: rgba(255, 255, 255, 0.92); }
  .url {
    display: inline-block;
    padding: 12px 24px;
    border-radius: 999px;
    background: #ffffff;
    color: #003e7e;
    font-size: 28px;
    font-weight: 600;
  }
</style>
</head>
<body>
  <div class="card">
    <img class="photo" src="../assets/img/profile.webp" alt="">
    <div class="text">
      <p class="label"><span class="logo"><span></span><span></span><span></span><span></span></span>Portfolio OS</p>
      <h1>DeVanté<br>Johnson-Rose</h1>
      <p class="tagline">Interactive portfolio and CV</p>
      <span class="url">devante.johnson-rose.co.uk</span>
    </div>
  </div>
</body>
</html>
